<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Skill Audit</title><style>:root{font-family:Tahoma,Arial,sans-serif;color-scheme:dark;color:#deedf3;background:#11202a}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:1450px;margin-inline:auto}h1{font-size:19px}p{font-size:13px;line-height:1.6;color:#acc5d2}a{color:#82deca}nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}button{font:inherit;background:#233e4f;color:inherit;border:1px solid #436677;padding:8px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#28645c}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:12px}.card{background:#19303c;border:1px solid #3b5a6a;border-radius:8px;padding:12px}h2{font-size:14px;margin:0}.card img{display:block;width:100%;height:auto;background:#203c36}.samples{display:flex;gap:4px;flex-wrap:wrap}.samples button{font-size:10px;padding:5px}.passive{font-size:12px;color:#acbbd1;padding:14px 0}.meta{font-size:11px;color:#91b6c6}.card p{font-size:11px}video{width:100%;max-width:900px;display:block}</style>
<h1>ตรวจภาพสกิลวิทยาศาสตร์รายอาชีพ</h1><a href="../../../../character-lab.html">กลับ Character Lab</a><p>ภาพจากการใช้สกิลจริงในเกมและระบบแสดงผลจริง • กดเวลาของแต่ละภาพเพื่อตรวจการเดินทาง กระทบ และจาง • ตัวละครคงภาพเดิมในเกม</p><nav id="jobs"></nav><div id="clip"></div><p id="status">กำลังโหลด…</p><div id="cards"></div>
<p><a href="individual-effects-board.jpg">ภาพรวมเอฟเฟกต์เฉพาะท่า Active 48 ท่า</a> · <a href="../source/skill-identity-plan.json">แนวคิดกลไกของแต่ละท่า</a></p>
<script>'use strict';let catalog,clips,selected='runecaster';const titles={runecaster:'Field Scientist',galdr:'Energy Engineer',seidr:'Nanotech Engineer',runelord:'Systems Architect',volva:'Combat Medic',norn:'Bioengineer',gythja:'Kinetic Specialist'};
function show(){document.querySelectorAll('[data-job]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.job===selected)));const root=document.querySelector('#cards');root.replaceChildren();const rows=catalog.rows.filter(r=>r.job===selected);document.querySelector('#status').textContent=`${titles[selected]} / ${rows.length} สกิล • ${rows.filter(r=>r.type==='active').length} Active`;
const holder=document.querySelector('#clip');holder.replaceChildren();const video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=selected+'.mp4';holder.append(video);const link=document.createElement('a');link.href=selected+'.mp4';link.textContent='เปิดคลิปการใช้สกิลใน Character Lab';holder.append(link);
for(const r of rows){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=r.name;card.append(h);const meta=document.createElement('p');meta.className='meta';meta.textContent=r.profile.family+' / '+r.profile.mode+' / '+r.profile.motif;card.append(meta);
if(r.samples){const im=document.createElement('img');const initial=r.samples[['runecaster','volva'].includes(selected)?1:4];im.src=initial.image;im.alt=r.name+' เวลา '+initial.at+' วินาที';im.style.cursor='zoom-in';im.title='กดดูภาพขนาดเต็ม';im.onclick=()=>window.open(im.src,'_blank');card.append(im);const bar=document.createElement('div');bar.className='samples';for(const sample of r.samples){const b=document.createElement('button');b.textContent=sample.at+'s';b.onclick=()=>{im.src=sample.image;im.alt=r.name+' เวลา '+sample.at+' วินาที';bar.querySelectorAll('button').forEach(q=>q.setAttribute('aria-pressed',String(q===b)))};bar.append(b)}card.append(bar);const cue=clips?.jobs.find(j=>j.job===selected)?.casts.find(c=>c.id===r.id);if(cue&&Number.isFinite(cue.at)){const play=document.createElement('button');play.textContent='ดูสกิลนี้ในคลิป';play.onclick=()=>{video.currentTime=cue.at;video.play().catch(()=>{});video.scrollIntoView({behavior:'smooth',block:'center'})};card.append(play)}}
else{const note=document.createElement('div');note.className='passive';note.textContent='Passive: ใช้ผลจริงของค่าสถานะ / เงื่อนไข / HP / SP / เกราะ ไม่สร้างท่ากดสกิลหรือระเบิดปลอม';card.append(note)}const desc=document.createElement('p');desc.textContent=r.description;card.append(desc);root.append(card)}}
Promise.all([fetch('catalog.json').then(r=>{if(!r.ok)throw Error('ยังไม่มีบัญชีภาพ');return r.json()}),fetch('CLIP-QA.json').then(r=>r.ok?r.json():null)]).then(([data,recordings])=>{catalog=data;clips=recordings;for(const [id,title] of Object.entries(titles)){const b=document.createElement('button');b.textContent=title;b.dataset.job=id;b.onclick=()=>{selected=id;show()};document.querySelector('#jobs').append(b)}show()}).catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
