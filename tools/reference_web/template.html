<title>Valhalla Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* codex terminal: แถบค้นหา + แท็บติดบน • แถวข้อมูลสแกนง่าย • รายละเอียดเปิดเป็นแผ่นด้านข้าง — ธีมมืดเดียวตามโลกเกม (หน้ากากวิซอร์สีฟ้า) */
:root {
  color-scheme: dark;
  --bg: #0a1017; --panel: #101a24; --panel-2: #15222e; --line: #213244; --line-2: #2c4258;
  --ink: #e4ecf4; --dim: #8b9fb4; --faint: #5d7086;
  --accent: #6ff3ff; --accent-ink: #062027; --gold: #ffd27a;
  --r-common: #a9b4c0; --r-uncommon: #7ee08a; --r-rare: #6fb8ff; --r-epic: #c58cff; --r-legend: #ffcf5a;
  --bad: #ff8f9c; --ok: #7ee08a;
  --display: "Chakra Petch", "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif;
  --body: "IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 60px; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 20px; margin-bottom: 14px; }
.eyebrow { font: 500 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(26px, 5vw, 40px)/1.05 var(--display); letter-spacing: .02em; margin: 2px 0 0; text-wrap: balance; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 12.5px; }
.counts b { font: 500 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 12px; }
.search svg { flex: none; color: var(--dim); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; font-size: 15px; }
.search kbd { font: 500 11px var(--mono); color: var(--faint); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid transparent; background: none; border-radius: 8px; padding: 6px 12px; color: var(--dim); font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--panel); }
.tab.on { color: var(--accent-ink); background: var(--accent); font-weight: 600; }
.tab small { font: 500 10.5px var(--mono); opacity: .75; margin-left: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.filters:empty { display: none; }
.filters label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12.5px; }
.filters select { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; max-width: 220px; }
.chipsel { display: flex; gap: 4px; flex-wrap: wrap; }
.chipsel button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--dim); cursor: pointer; }
.chipsel button.on { border-color: var(--accent); color: var(--ink); background: var(--panel-2); }
.result-n { margin-left: auto; font: 500 12px var(--mono); color: var(--faint); }

main { margin-top: 14px; }
.empty { padding: 40px 0; text-align: center; color: var(--dim); }
.list { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-align: left; width: 100%; }
.row:hover { border-color: var(--line-2); background: var(--panel-2); }
.row .ic { width: 44px; height: 44px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center; overflow: hidden; font: 600 18px var(--display); color: var(--faint); }
.row .ic img { width: 100%; height: 100%; object-fit: cover; }
.row .ic.item img { object-fit: contain; padding: 3px; }
.row .main { min-width: 0; }
.row .nm { font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.row .sub { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .side { display: flex; flex-wrap: nowrap; justify-content: end; gap: 4px 14px; }
.kv { display: grid; text-align: right; line-height: 1.15; }
.kv span { font: 500 10px var(--mono); letter-spacing: .08em; color: var(--faint); text-transform: uppercase; }
.kv b { font: 500 13.5px var(--mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--dim); white-space: nowrap; line-height: 18px; }
.pill.pass { border-color: transparent; background: var(--panel-2); }
.pill.agg { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.pill.mvp { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
.r-common { color: var(--r-common); } .r-uncommon { color: var(--r-uncommon); } .r-rare { color: var(--r-rare); } .r-epic { color: var(--r-epic); } .r-legend { color: var(--r-legend); }
.pill.r-common { border-color: color-mix(in srgb, var(--r-common) 40%, transparent); } .pill.r-uncommon { border-color: color-mix(in srgb, var(--r-uncommon) 45%, transparent); }
.pill.r-rare { border-color: color-mix(in srgb, var(--r-rare) 45%, transparent); } .pill.r-epic { border-color: color-mix(in srgb, var(--r-epic) 50%, transparent); } .pill.r-legend { border-color: color-mix(in srgb, var(--r-legend) 55%, transparent); }

/* Class */
.lines { display: grid; gap: 14px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; }
.branch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cls { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; width: 100%; }
.cls::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; border-radius: 12px 0 0 12px; background: var(--glow); }
.cls:hover { border-color: var(--line-2); background: var(--panel-2); }
.cls img, .cls .em { width: 48px; height: 48px; grid-row: span 2; }
.cls .em { border-radius: 50%; background: var(--panel-2); }
.cls h3 { margin: 0; font: 600 16px/1.2 var(--display); }
.cls .th { color: var(--dim); font-size: 12px; }
.cls .role { grid-column: 2; font-size: 12.5px; }
.cls .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tier { font: 500 10px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }

/* maps */
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.mapc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.mapc h3 { margin: 0; font: 600 17px/1.2 var(--display); display: flex; justify-content: space-between; gap: 8px; }
.mapc h3 span { font: 500 12px var(--mono); color: var(--accent); white-space: nowrap; }
.mapc .th { color: var(--dim); font-size: 12.5px; margin-top: -6px; }
.mobchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mobchip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 2px; cursor: pointer; font-size: 12.5px; }
.mobchip img { width: 24px; height: 24px; border-radius: 50%; }
.mobchip i { font: 500 11px var(--mono); font-style: normal; color: var(--faint); }
.mapc .k { font: 500 10.5px var(--mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }

/* quests / tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 9px 12px; background: var(--panel); position: sticky; top: 0; }
td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ch { font: 600 12px var(--mono); color: var(--accent); }

/* gacha */
.gacha { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
.rules { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.rules h3 { margin: 0; font: 600 18px var(--display); }
.rules dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.rules dt { color: var(--dim); } .rules dd { margin: 0; font-weight: 500; }
.rate { display: grid; grid-template-columns: 30px minmax(0, 1fr) 56px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rate img, .rate .ph { width: 30px; height: 30px; object-fit: contain; }
.rate .bar2 { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-top: 4px; }
.rate .bar2 b { display: block; height: 100%; background: var(--accent); }
.rate .pc { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* sheet */
[hidden] { display: none !important; }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(2, 6, 10, .6); display: flex; justify-content: flex-end; }
.sheet { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line-2); padding: 18px 18px 40px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.sheet .x { float: right; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.sh-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; margin: 4px 0 14px; clear: both; }
.sh-head img, .sh-head .ph { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--panel-2); }
.sh-head h2 { margin: 0; font: 700 22px/1.15 var(--display); text-wrap: balance; }
.sh-head .th { color: var(--dim); font-size: 13px; }
.sec { margin-top: 16px; }
.sec h4 { margin: 0 0 6px; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.sec p { margin: 0; color: var(--ink); max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 6px 10px; }
.stat span { display: block; font: 500 10px var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
.stat b { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; }
.drops { display: grid; gap: 4px; }
.drop { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.drop:hover { background: var(--panel-2); }
.drop img, .drop .ph { width: 28px; height: 28px; object-fit: contain; border-radius: 6px; }
.drop .ph { background: var(--panel-2); }
.drop .pc { font: 500 12.5px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.sk-mini { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.sk-mini img, .sk-mini .ph { width: 36px; height: 36px; border-radius: 8px; }
.sk-mini small { color: var(--dim); display: block; font-size: 12px; }
.build { display: flex; flex-wrap: wrap; gap: 4px; }
.mono { font-family: var(--mono); }

@media (max-width: 760px) {
  .line, .branch, .gacha { grid-template-columns: 1fr; }
  .row { grid-template-columns: 40px minmax(0, 1fr); }
  .row .ic { width: 40px; height: 40px; }
  .row .side { grid-column: 2; justify-content: start; flex-wrap: wrap; }
  .kv { text-align: left; }
  .maps { grid-template-columns: 1fr; }
  .search kbd { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">IRON VALHALLA · ข้อมูลเกม</div>
      <h1>Valhalla Codex</h1>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="bar">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ค้นหาชื่อ คำอธิบาย มอน ไอเทม…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <nav class="tabs" id="tabs" aria-label="หมวด"></nav>
    <div class="filters" id="filters"></div>
  </div>
  <main id="out"></main>
</div>
<div class="scrim" id="scrim" hidden></div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (n || 0).toLocaleString('en-US');
const pct = x => { const v = x * 100, t = v >= 1 ? v.toFixed(1) : v >= 0.1 ? v.toFixed(2) : v.toFixed(3); return (t.includes('.') ? t.replace(/0+$/, '').replace(/\.$/, '') : t) + '%'; };
const IC = D.icons, J = D.jobs;
const img = (k, cls) => IC[k] ? `<img src="${IC[k]}" alt="" loading="lazy"${cls ? ` class="${cls}"` : ''}>` : `<span class="ph"></span>`;
const RAR = { common: 'ธรรมดา', uncommon: 'ดี', rare: 'หายาก', epic: 'Epic', legend: 'ตำนาน' };
const RORD = ['common', 'uncommon', 'rare', 'epic', 'legend'];
const SLOT = { weapon: 'อาวุธ', armor: 'ชุดเกราะ', head: 'หมวก', shield: 'โล่', garment: 'ผ้าคลุม', shoes: 'รองเท้า', acc: 'เครื่องประดับ', accessory: 'เครื่องประดับ' };
const RACE = { formless: 'ไร้รูป', plant: 'พืช', insect: 'แมลง', brute: 'สัตว์', angel: 'เทวดา', undead: 'อมตะ', demon: 'ปีศาจ' };
const ELE = Object.assign({ neutral: 'ไร้ธาตุ', water: 'น้ำ', earth: 'ดิน', fire: 'ไฟ', wind: 'ลม', holy: 'ศักดิ์สิทธิ์', undead: 'อมตะ', poison: 'พิษ', shadow: 'มืด' }, D.elem || {});
const STAT = { str: 'STR', agi: 'AGI', vit: 'VIT', int: 'INT', dex: 'DEX', luk: 'LUK', atk: 'ATK', matk: 'MATK', def: 'DEF', mdef: 'MDEF', hit: 'HIT', flee: 'FLEE', crit: 'CRIT', hp: 'HP', sp: 'SP', aspd: 'ASPD', hpPct: 'HP%', spPct: 'SP%', atkPct: 'ATK%', matkPct: 'MATK%', speedPct: 'วิ่ง%', cdCut: 'ลดคูลดาวน์%', healPct: 'ฮีล%' };
const bonus = o => o ? Object.entries(o).map(([k, v]) => `${STAT[k] || k} ${v > 0 ? '+' : ''}${v}`).join(' · ') : '';
const MOB = Object.fromEntries(D.mobs.map(m => [m.id, m])), ITEM = Object.fromEntries(D.items.map(i => [i.id, i])), SK = Object.fromEntries(D.skills.map(s => [s.id, s])), MAP = Object.fromEntries(D.maps.map(m => [m.id, m]));
const firsts = Object.keys(D.second), seconds = firsts.flatMap(f => D.second[f]);
const line = j => { const o = []; for (let x = j; x && J[x]; x = J[x].parent) o.push(x); return o; };
const canUse = (jobs, cls) => jobs === 'all' || !cls || line(cls).some(x => jobs.includes(x));
const jobsTxt = j => j === 'all' || !j ? 'ทุก Class' : j.filter(x => x !== 'novice').length >= 6 ? 'หลาย Class' : j.filter(x => x !== 'novice').map(x => J[x] ? J[x].name : x).join(', ');
const dropsBy = {};
for (const m of D.mobs) { for (const [iid, r] of m.drops) (dropsBy[iid] = dropsBy[iid] || []).push([m.id, r]); if (m.chip) (dropsBy[m.chip] = dropsBy[m.chip] || []).push([m.id, null]); }
for (const k in dropsBy) dropsBy[k].sort((a, b) => (b[1] ?? 1) - (a[1] ?? 1));
const srcTxt = id => [D.shopOf[id] ? 'ร้านค้า' : '', ...(dropsBy[id] || []).slice(0, 2).map(([m, r]) => `${MOB[m].name}${r != null ? ' ' + pct(r) : ''}`)].filter(Boolean).join(' · ');
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
const clsOpts = (all = 'ทุก Class') => `<option value="">${all}</option>` + firsts.map(f => `<optgroup label="${esc(J[f].name)}"><option value="${f}">${esc(J[f].name)}</option>${D.second[f].map(s => `<option value="${s}">↳ ${esc(J[s].name)}</option>`).join('')}</optgroup>`).join('');

// ---------- state ----------
const S = { tab: 'class', q: '', f: {} };
try { const t = localStorage.getItem('codex-tab'); if (t) S.tab = t; } catch (e) {}
if (location.hash && /^#[a-z]+$/.test(location.hash)) S.tab = location.hash.slice(1);
const match = (...parts) => !S.q || parts.join(' ').toLowerCase().includes(S.q);

// ---------- tabs ----------
const weapons = D.items.filter(i => i.type === 'weapon'), armors = D.items.filter(i => i.type === 'armor'), chips = D.items.filter(i => i.type === 'card'), misc = D.items.filter(i => i.type === 'use' || i.type === 'etc');
const TABS = {
  class: { label: 'Class', n: firsts.length + seconds.length },
  skill: { label: 'สกิล', n: D.skills.length },
  mob: { label: 'มอนสเตอร์', n: D.mobs.length },
  weapon: { label: 'อาวุธ', n: weapons.length },
  armor: { label: 'ชุดเกราะ', n: armors.length },
  chip: { label: 'ชิป', n: chips.length },
  item: { label: 'ไอเทม', n: misc.length },
  map: { label: 'แผนที่', n: D.maps.length },
  quest: { label: 'เควสต์', n: D.quests.length },
  gacha: { label: 'กาชา', n: D.gacha.table.length },
};
if (!TABS[S.tab]) S.tab = 'class';
$('#counts').innerHTML = [['Class', firsts.length + seconds.length], ['สกิล', D.skills.length], ['มอน', D.mobs.length], ['ไอเทม', D.items.length], ['แผนที่', D.maps.length]].map(([k, v]) => `<span><b>${v}</b> ${k}</span>`).join('');
function drawTabs() {
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, t]) => `<button type="button" class="tab${k === S.tab ? ' on' : ''}" data-tab="${k}">${t.label}<small>${t.n}</small></button>`).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; S.f = {}; try { localStorage.setItem('codex-tab', S.tab); } catch (err) {} history.replaceState(null, '', '#' + S.tab); render(); });
$('#q').addEventListener('input', e => { S.q = e.target.value.trim().toLowerCase(); body(); });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } if (e.key === 'Escape') closeSheet(); });

// ---------- filters ----------
const FILTERS = {
  skill: () => `<label>Class <select data-f="cls">${clsOpts()}</select></label><div class="chipsel" data-f="type">${[['', 'ทั้งหมด'], ['active', 'กดใช้'], ['passive', 'ติดตัว']].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join('')}</div>`,

    ${g.build ? `<div class="sec"><h4>ลำดับอัปสกิล</h4><div class="build">${g.build.map(([s, v], i) => `<span class="pill">${i + 1}. ${esc(SK[s] ? SK[s].name : s)} ${v}</span>`).join('')}</div></div>` : ''}
    ${g.tips ? `<div class="sec"><h4>เคล็ดลับ</h4><p>${esc(g.tips)}</p></div>` : ''}
    <div class="sec"><h4>สกิล</h4>${j.skills.map(s => SK[s] ? `<div class="sk-mini" data-skill="${s}">${img('s:' + s)}<span><b>${esc(SK[s].name)}</b> <span style="color:var(--faint);font-size:12px">${SK[s].type === 'passive' ? 'ติดตัว' : 'กดใช้'} · Lv ${SK[s].max}</span><small>${esc(SK[s].desc)}</small></span></div>` : '').join('')}</div>`);
}

function render() { drawTabs(); drawFilters(); body(); }
render();
</script>
